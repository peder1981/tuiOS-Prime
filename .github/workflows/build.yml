name: Build e Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Instalar dependências do sistema
      run: |
        sudo apt update
        sudo apt install -y \
          qemu-system-x86 \
          ovmf \
          mtools \
          dosfstools \
          gdisk
    
    - name: Instalar just
      run: |
        curl -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
        just --version
    
    - name: Configurar Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: x86_64-unknown-none
    
    - name: Build do kernel
      run: |
        cd kernel
        export RUSTC_BOOTSTRAP=1
        export RUSTFLAGS="-C link-arg=-static -C link-arg=-no-pie -C link-arg=--image-base -C link-arg=0xffffffff80000000"
        cargo build --target x86_64-unknown-none
      env:
        RUST_BACKTRACE: 1
    
    - name: Executar testes
      run: just test-all
