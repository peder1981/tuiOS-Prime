name: Build e Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build e Testes
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Instalar dependências do sistema
      run: |
        sudo apt update
        sudo apt install -y \
          qemu-system-x86 \
          ovmf \
          mtools \
          dosfstools \
          gdisk
    
    - name: Instalar just
      run: |
        curl -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
        just --version
    
    - name: Configurar Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        targets: x86_64-unknown-none
    
    - name: Build do kernel
      run: |
        cd kernel
        export RUSTC_BOOTSTRAP=1
        export RUSTFLAGS="-C link-arg=-static -C link-arg=-no-pie -C link-arg=--image-base -C link-arg=0xffffffff80000000"
        cargo build --target x86_64-unknown-none
      env:
        RUST_BACKTRACE: 1
    
    - name: Instalar pytest (tuios-apps)
      run: python3 -m pip install --user pytest

    - name: Executar testes
      run: just test-all

  iso-install:
    name: ISO + Instalador (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v4

    - name: Detectar binário AdvPP vendored
      id: advpp
      run: echo "ok=$([ -f nixos/advpp/advplc ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Instalar Nix
      if: steps.advpp.outputs.ok == 'true'
      uses: cachix/install-nix-action@v27
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Dependências (QEMU + OVMF)
      if: steps.advpp.outputs.ok == 'true'
      run: |
        sudo apt update
        sudo apt install -y qemu-system-x86 qemu-utils ovmf
        # KVM no runner: permissões para o passo de teste
        sudo chmod 666 /dev/kvm || true

    - name: Build da ISO (puro, sem --impure)
      if: steps.advpp.outputs.ok == 'true'
      run: nix build .#nixosConfigurations.iso.config.system.build.isoImage --print-out-paths --out-link result

    - name: Teste do instalador (T1+T2)
      if: steps.advpp.outputs.ok == 'true'
      run: bash scripts-assert/install.assert.sh

    - name: Aviso (sem AdvPP vendored)
      if: steps.advpp.outputs.ok != 'true'
      run: echo "::notice::Job ISO pulado — binário nixos/advpp/advplc não versionado (71MB)"
