[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tuios-apps"
version = "1.0.0"
description = "Apps AdvPL de primeira classe no tuiOS"
requires-python = ">=3.11"

[project.scripts]
tuios-apps = "tuiosapps.cli:main"

[tool.setuptools]
packages = ["tuiosapps"]
